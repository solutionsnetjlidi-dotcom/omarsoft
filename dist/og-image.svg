  <!-- Logo circle -->
  <circle cx="140" cy="140" r="64" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="140" cy="140" r="58" fill="#0a1628"/>
  <!-- Globe lines -->
